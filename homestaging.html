<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Visitia</title>
  <link rel="stylesheet" href="homestaging.css">
</head>
<body>

  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <h2 class="sidebar-title">Home Staging Visitia</h2>

      <div class="session-box">
        Sesión activa: <strong>Córdoba</strong>
      </div>

      <nav class="menu">
        <a href="homestaging.html" class="menu-item active">Dashboard</a>
        <a href="planeshomestaging.html" class="menu-item">Planes</a>
        <a href="tiendahomestaging.html" class="menu-item">Tienda</a>
        <a href="perfilhomestaging.html" class="menu-item">Perfil</a>
      </nav>

      <button class="logout-btn">Cerrar Sesión (Sign Out)</button>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">

      <!-- HEADER -->
      <header class="header">
        <div class="logo">
          <img src="Visitia.png" alt="Visitia">
        </div>
        <h1>Dashboard de Córdoba</h1>
      </header>

      <!-- TABS -->
      <div class="tabs">
        <button class="tab active">Mis Proyectos</button>
        <button class="tab">Crear Proyecto</button>
        <button class="tab">Publicar Proyectos</button>
        <button class="tab">Mi Perfil</button>
      </div>

      <!-- CONTENT -->
      <section class="content">
        <h2>Tus Proyectos Existentes</h2>

        <div class="project-card">
          <span class="arrow">▶</span>
          <span class="project-name">📌 Prueba</span>
          <span class="project-info">(1 versiones)</span>
        </div>
      </section>

    </main>
  </div>

</body>
</html>
