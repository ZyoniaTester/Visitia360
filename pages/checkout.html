<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Checkout | Visitia</title>
  <link rel="stylesheet" href="checkout.css">
</head>
<body>

  <div class="checkout-layout">

    <!-- COLUMNA PLAN -->
    <div class="plan-resumen">
      <h2>Plan Básico</h2>
      <p class="precio">19,95€ / mes</p>

      <ul class="beneficios">
        <li>✔ 50 tours activos</li>
        <li>✔ Home Staging con IA</li>
        <li>✔ Integración en tu web</li>
        <li>✔ Vídeo del tour</li>
        <li>✔ Cancelas cuando quieras</li>
      </ul>
    </div>

    <!-- COLUMNA PAGO -->
    <div class="pago-box">
      <h1>Pago seguro</h1>

      <form>
        <label>Nombre del titular</label>
        <input type="text" placeholder="Juan Pérez">

        <label>Número de tarjeta</label>
        <input type="text" placeholder="4242 4242 4242 4242">

        <div class="fila">
          <div>
            <label>Vencimiento</label>
            <input type="text" placeholder="MM/AA">
          </div>

          <div>
            <label>CVC</label>
            <input type="text" placeholder="123">
          </div>
        </div>

        <button class="btn-pagar" type="button" onclick="pagoExitoso()">
          Pagar y activar plan
        </button>
      </form>

      <p class="seguridad">Pago simulado · Solo prueba visual</p>
    </div>

  </div>


  <script>
  const params = new URLSearchParams(window.location.search);
  const plan = params.get("plan");

  if (plan === "basico") {
    document.querySelector("h2").innerText = "Plan Básico";
    document.querySelector(".precio").innerText = "19,95€ / mes";
  }
</script>

  <script>
    function pagoExitoso() {
      alert("✅ Plan Básico activado (PRUEBA)");
      window.location.href = "homestaging.html";
    }
  </script>

</body>
</html>
