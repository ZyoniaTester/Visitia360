<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Perfil | Visitia</title>
  <link rel="stylesheet" href="perfilhomestaging.css">
</head>
<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="sidebar-title">Home Staging Visitia</h2>

    <div class="session-box">
      Sesión activa: <strong>Córdoba</strong>
    </div>

    <nav class="menu">
      <a href="homestaging.html" class="menu-item">Dashboard</a>
      <a href="planeshomestaging.html" class="menu-item">Planes</a>
      <a href="tiendahomestaging.html" class="menu-item">Tienda</a>
      <a href="perfilhomestaging.html" class="menu-item active">Perfil</a>
    </nav>

    <button class="logout-btn">Cerrar Sesión</button>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- HEADER -->
    <header class="header">
      <div class="logo">
        <img src="Visitia.png">
      </div>
      <h1>Mi Perfil</h1>
    </header>

    <!-- PERFIL -->
    <section class="perfil-container">

      <!-- INFO PERSONAL -->
      <div class="perfil-card">
        <h2>Datos Personales</h2>

        <div class="form-group">
          <label>Nombre</label>
          <input type="text" value="Córdoba">
        </div>

        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" value="efraintellez4@gmail.com">
        </div>

        <div class="form-group">
          <label>Teléfono</label>
          <input type="text" placeholder="Opcional">
        </div>

        <div class="form-group">
          <label>Descripción</label>
          <textarea placeholder="Describe tu negocio o perfil..."></textarea>
        </div>
      </div>

      <!-- INFO EMPRESA -->
      <div class="perfil-card">
        <h2>Datos de Empresa</h2>

        <div class="form-group">
          <label>Nombre Comercial</label>
          <input type="text" placeholder="Nombre de tu inmobiliaria o marca">
        </div>

        <div class="form-group">
          <label>Ciudad</label>
          <input type="text" value="Córdoba, México">
        </div>

        <div class="form-group">
          <label>Sitio Web</label>
          <input type="url" placeholder="https://tusitio.com">
        </div>
      </div>

      <!-- PLAN ACTUAL -->
      <div class="perfil-card">
        <h2>Plan Actual</h2>

        <div class="plan-box">
          <span class="plan-tag">PLAN FREE</span>
          <p>3 proyectos activos</p>
          <a href="planes.html" class="btn-subir-plan">Mejorar Plan</a>
        </div>
      </div>

      <!-- ESTADÍSTICAS -->
      <div class="perfil-card">
        <h2>Estadísticas</h2>

        <div class="stats-grid">
          <div class="stat">
            <strong>1</strong>
            <span>Proyecto activo</span>
          </div>
          <div class="stat">
            <strong>0</strong>
            <span>Tours publicados</span>
          </div>
          <div class="stat">
            <strong>0</strong>
            <span>Visitas este mes</span>
          </div>
        </div>
      </div>

      <!-- SEGURIDAD -->
      <div class="perfil-card">
        <h2>Seguridad</h2>

        <div class="form-group">
          <label>Cambiar Contraseña</label>
          <input type="password" placeholder="Nueva contraseña">
        </div>

        <button class="btn-danger">Restablecer Contraseña</button>
      </div>

    </section>

    <!-- GUARDAR -->
    <div class="perfil-actions">
      <button class="btn-save">Guardar cambios del perfil</button>
    </div>

  </main>
</div>

</body>
</html>
